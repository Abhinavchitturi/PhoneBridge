<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone screen</title>
<!--
  The phone's screen in a window (mac/Sources/Cast.swift CastWindow): H.264 frames from the phone ("v" messages,
  Annex B) decoded with WebCodecs and drawn to a canvas; typing here types on the phone (cast_input).
-->
<link rel="stylesheet" href="common.css">
<style>
  body { background: #000; display: grid; place-items: center; overflow: hidden; }
  canvas { max-width: 100vw; max-height: 100vh; display: block; }
  .waiting { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: var(--secondary); text-align: center; padding: 30px; font-size: 13px; line-height: 1.45; }
  .waiting .ico { font-size: 34px; color: var(--accent); }
  .diag { position: fixed; left: 8px; bottom: 8px; font: 10px ui-monospace, Consolas, monospace; color: rgba(255,255,255,.45); white-space: pre; pointer-events: none; }
</style>
</head>
<body>
<canvas id="screen" width="9" height="19"></canvas>
<div class="waiting" id="waiting"><svg class="ico"><use href="#i-screen"/></svg><div>Waiting for your phone…<br>Tap “Start” on the phone (choose one app or the entire screen).</div></div>
<div class="diag" id="diag"></div>
<script src="common.js"></script>
<script>
"use strict";
const cv = $("#screen"), ctx = cv.getContext("2d");
let decoder = null, config = null, frames = 0, decoded = 0, errors = 0, lastError = "", phoneDiag = "";

/** "avc1.PPCCLL" from the SPS (profile, constraints, level). */
function codecFrom(sps) { return "avc1." + [sps[1], sps[2], sps[3]].map((b) => b.toString(16).padStart(2, "0")).join(""); }
function nals(data) {
  const out = [];
  let start = -1;
  for (let i = 0; i + 2 < data.length; i++) {
    if (data[i] === 0 && data[i + 1] === 0 && data[i + 2] === 1) {
      if (start >= 0) out.push([start, i > 0 && data[i - 1] === 0 ? i - 1 : i]);
      start = i + 3; i += 2;
    }
  }
  if (start >= 0) out.push([start, data.length]);
  return out.map(([s, e]) => data.subarray(s, e));
}
function makeDecoder(codec) {
  if (decoder) try { decoder.close(); } catch (e) { /* closed */ }
  decoder = new VideoDecoder({
    output: (frame) => {
      if (cv.width !== frame.displayWidth || cv.height !== frame.displayHeight) { cv.width = frame.displayWidth; cv.height = frame.displayHeight; fit(); }
      ctx.drawImage(frame, 0, 0);
      frame.close();
      decoded++;
      $("#waiting").style.display = "none";
    },
    error: (e) => { errors++; lastError = e.message; config = null; },
  });
  // No "description": WebCodecs then takes Annex B (start codes, SPS/PPS inline), which is what the phone sends.
  decoder.configure({ codec, optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
  config = codec;
}
function frame(b64, key) {
  frames++;
  const data = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const sps = nals(data).find((n) => (n[0] & 0x1f) === 7);
  if (sps) { const codec = codecFrom(sps); if (codec !== config || !decoder || decoder.state === "closed") makeDecoder(codec); }
  if (!decoder || decoder.state !== "configured") return; // wait for a key frame with SPS/PPS
  const isKey = key || nals(data).some((n) => (n[0] & 0x1f) === 5);
  if (decoder.decodeQueueSize > 4 && !isKey) return; // falling behind: skip until the next key frame
  try { decoder.decode(new EncodedVideoChunk({ type: isKey ? "key" : "delta", timestamp: performance.now() * 1000, data })); }
  catch (e) { errors++; lastError = e.message; }
}
function fit() { cv.style.aspectRatio = `${cv.width} / ${cv.height}`; }
setInterval(() => { $("#diag").textContent = `received ${frames} · shown ${decoded}${errors ? ` · errors ${errors} (${lastError})` : ""}${phoneDiag ? "\n" + phoneDiag : ""}`; }, 1000);
document.addEventListener("keydown", (e) => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === "Backspace") send("input", { kind: "backspace" });
  else if (e.key === "Enter") send("input", { kind: "enter" });
  else if (e.key.length === 1) send("input", { kind: "text", text: e.key });
  else return;
  e.preventDefault();
});
document.addEventListener("paste", (e) => { const t = e.clipboardData.getData("text"); if (t) send("input", { kind: "text", text: t }); });
onHost((m) => {
  if (m.type === "v") frame(m.d, m.k);
  else if (m.type === "reset") { frames = decoded = errors = 0; config = null; $("#waiting").style.display = ""; }
  else if (m.type === "diag") phoneDiag = m.text;
  else if (m.type === "state" && m.state.theme && typeof applyTheme === "function") applyTheme(m.state.theme);
});
send("ready");
</script>
</body>
</html>
